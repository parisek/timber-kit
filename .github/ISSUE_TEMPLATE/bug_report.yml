name: Bug report
description: Report something that does not work as documented.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: timber-kit version
      placeholder: "1.65.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: PHP, WordPress and Timber versions.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
