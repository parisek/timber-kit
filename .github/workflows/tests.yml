name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  composer:
    name: composer hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate composer.json
        run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - name: Audit dependencies for known advisories
        run: composer audit
      - name: composer.json is normalized
        run: composer normalize --dry-run

  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Unit tests
        run: composer test
      - name: Property tests
        env:
          ERIS_SEED: ${{ github.run_id }}
        run: composer test:property

  adr-index:
    runs-on: ubuntu-latest
    name: docs/adr/ index is in sync
    steps:
      - uses: actions/checkout@v5

      - name: Validate the ADR directory against the index
        run: python3 scripts/check-adr-index.py

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer phpstan
