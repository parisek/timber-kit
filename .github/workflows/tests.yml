name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  composer:
    name: composer hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate composer.json
        run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - name: Audit dependencies for known advisories
        run: composer audit
      - name: composer.json is normalized
        run: composer normalize --dry-run

  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Unit tests
        run: composer test
      - name: Property tests
        env:
          ERIS_SEED: ${{ github.run_id }}
        run: composer test:property

  encoder:
    # The Unit job's ImageMagick has no AVIF encoder, so EncoderQualityTest
    # skips its AVIF cases there. This job installs one and makes a skip fail.
    name: AVIF encoder
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install an AVIF-capable ImageMagick
        run: sudo apt-get update && sudo apt-get install -y libmagickwand-dev libheif-dev libheif-plugin-aomenc libheif-plugin-dav1d
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: imagick, gd
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Encoder quality test
        env:
          TIMBERKIT_REQUIRE_AVIF_ENCODER: '1'
        run: vendor/bin/phpunit tests/Unit/Resizer/EncoderQualityTest.php

  adr-index:
    runs-on: ubuntu-latest
    name: docs/adr/ index is in sync
    steps:
      - uses: actions/checkout@v5

      - name: Validate the ADR directory against the index
        run: python3 scripts/check-adr-index.py

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer phpstan
